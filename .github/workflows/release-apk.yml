name: Build and Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore debug keystore and optional config
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            echo "debug.keystore missing or empty; generating CI debug keystore"
            rm -f debug.keystore
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -lh debug.keystore
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json
          fi
          touch .env

      - name: Ensure Android SDK licenses
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Compute release version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          VERSION_NAME="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        continue-on-error: true
        run: |
          gradle :app:testDebugUnitTest \
            -PappVersionCode="${{ steps.version.outputs.version_code }}" \
            -PappVersionName="${{ steps.version.outputs.version_name }}" \
            -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            --max-workers=2 --no-configuration-cache --no-daemon --stacktrace || true

      - name: Upload unit test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report-${{ github.run_number }}
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Build APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug \
            -PappVersionCode="${{ steps.version.outputs.version_code }}" \
            -PappVersionName="${{ steps.version.outputs.version_name }}" \
            -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            --max-workers=2 --no-configuration-cache --no-daemon --stacktrace --console=plain \
            2>&1 | tee build-apk.log || {
              echo "=== BUILD APK FAILURE SUMMARY ==="
              tail -n 120 build-apk.log
              exit 1
            }

      - name: Upload APK build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-apk-log-${{ github.run_number }}
          path: build-apk.log
          if-no-files-found: ignore

      - name: Prepare APK asset
        run: |
          mkdir -p release-assets
          ls -lh app/build/outputs/apk/debug/
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/InstaSnap-${{ steps.version.outputs.tag }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstaSnap-${{ steps.version.outputs.tag }}
          path: release-assets/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: InstaSnap ${{ steps.version.outputs.tag }}
          body: |
            Automated APK build for commit `${{ github.sha }}`.
            Download and open the attached APK on your Android device to update InstaSnap.
          generate_release_notes: true
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
